# This generates application/launcher icons, not an in-app image asset.
# Keep the original artwork at assets/branding/BK103-source.jpg, then run:
# powershell -ExecutionPolicy Bypass -File tool/generate_icons.ps1
flutter_launcher_icons:
  image_path: lib/favicon.png

  # Android launcher icon, including Android 8+ adaptive icon layers.
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#F5F2EA"
  adaptive_icon_foreground: lib/favicon.png
  adaptive_icon_foreground_inset: 16

  # iPhone/iPad home-screen icon. Apple icons cannot contain alpha.
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#F5F2EA"

  # Windows executable, taskbar, Start menu, and title-bar icon.
  windows:
    generate: true
    image_path: lib/favicon.png
    icon_size: 256

  # macOS application bundle and Dock icon.
  macos:
    generate: true
    image_path: lib/favicon.png
